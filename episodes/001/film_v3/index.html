<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>EP001 — What Really Hit Entry-Level Jobs in 2022</title>
<!-- 본편 v3: 시안 v2 승인 방향(3D 데이터 무대 + 종이 콜라주 + 키네틱 종이 띠). 컷 시간표는 cuts.json -->
<style>
  :root{--paper:#f4efe3;--ink:#1a1a1a;--red:#c8392e;--hl:#ffe14d;--mustard:#e5b650;--slate:#6f8fb0;--mat:#1f5d4c}
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#174a3d;font-family:"Avenir Next Condensed","DIN Condensed",sans-serif}
  #cam{position:absolute;inset:0;transform-origin:50% 50%}
  #gl{position:absolute;inset:0;width:1920px;height:1080px}
  #dom{position:absolute;inset:0}
  /* 숨긴 컷도 배경을 미리 디코드해 두려고 display 대신 visibility */
  .cut{position:absolute;inset:0;visibility:hidden;overflow:hidden}.cut.on{visibility:visible}
  .bg{position:absolute;inset:-3%;background:center/cover no-repeat;transform-origin:50% 50%}
  .mat{position:absolute;inset:-3%;background-color:var(--mat);
    background-image:linear-gradient(#3d806b 2px,transparent 2px),linear-gradient(90deg,#3d806b 2px,transparent 2px),linear-gradient(#2f735f 1px,transparent 1px),linear-gradient(90deg,#2f735f 1px,transparent 1px);
    background-size:300px 300px,300px 300px,60px 60px,60px 60px}
  .paperbg{position:absolute;inset:0;background:var(--paper) radial-gradient(circle at 30% 20%,rgba(0,0,0,.04),transparent 60%)}
  .redbg{position:absolute;inset:0;background:var(--red)}
  .strip{position:absolute;background:var(--paper);color:var(--ink);padding:12px 34px 4px;font-weight:800;line-height:1.08;text-transform:uppercase;white-space:nowrap;opacity:0;
    box-shadow:0 12px 26px rgba(0,0,0,.38);clip-path:polygon(0 6%,4% 0,38% 4%,71% 0,100% 6%,98% 52%,100% 95%,62% 100%,28% 96%,0 100%,2% 48%)}
  .strip.red{background:var(--red);color:var(--paper)}.strip.yel{background:var(--hl)}.strip.mus{background:var(--mustard)}.strip.sla{background:#a9bfd6}
  .strip.ink{background:var(--ink);color:var(--paper)}.strip.low{text-transform:none}
  .paperbg~.strip{box-shadow:0 6px 14px rgba(0,0,0,.18)}
  .stamp{position:absolute;border:7px solid var(--red);color:var(--red);font-weight:800;padding:6px 24px 0;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;background:rgba(244,239,227,.92);opacity:0}
  .tape{position:absolute;width:170px;height:46px;background:rgba(240,225,170,.8);box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .print{position:absolute;background:#fbf8f0;padding:22px 22px 60px;box-shadow:0 22px 46px rgba(0,0,0,.45);transform-origin:50% 50%}
  .print img{display:block}
  .doc{position:absolute;overflow:hidden;background:#fff;box-shadow:0 24px 50px rgba(0,0,0,.5);transform-origin:50% 50%;
    clip-path:polygon(0 1%,4% 0,30% 2%,60% 0,100% 1.5%,99% 40%,100% 99%,70% 100%,40% 98%,0 100%,1% 60%)}
  .hlbar{position:absolute;background:var(--hl);opacity:.45;mix-blend-mode:multiply}
  .src{position:absolute;left:40px;bottom:34px;font:500 22px Menlo,monospace;color:var(--paper);background:rgba(0,0,0,.55);padding:7px 14px;border-left:6px solid var(--mustard)}
  .bug{position:absolute;right:40px;bottom:34px;font:800 26px "Avenir Next Condensed";letter-spacing:.12em;color:var(--paper);opacity:.85}
  .paperbg~.bug{color:var(--ink);opacity:.6}
  .chip{position:absolute;font:700 26px Menlo,monospace;background:var(--hl);color:var(--ink);padding:6px 14px;transform:rotate(-3deg)}
  .endcard{position:absolute;left:0;right:0;top:420px;text-align:center;font-weight:800;font-size:150px;letter-spacing:.06em;color:var(--paper)}
  .endcard small{display:block;font:500 34px Menlo,monospace;letter-spacing:.1em;margin-top:18px;opacity:.8}
  /* 전환 막: 찢긴 종이 한 장, 빨간 테이프 띠 */
  #wipe{position:absolute;top:-5%;bottom:-5%;width:120%;left:-10%;background:var(--paper);transform:translateX(-130%);
    clip-path:polygon(4% 0,96% 0,93% 12%,98% 30%,94% 52%,99% 71%,95% 88%,97% 100%,3% 100%,6% 84%,1% 63%,5% 41%,0 22%,5% 9%);box-shadow:0 0 60px rgba(0,0,0,.4)}
  #rip{position:absolute;top:30%;height:46%;width:160%;left:-30%;background:var(--red);transform:translateX(-150%) rotate(-12deg);
    clip-path:polygon(0 6%,20% 0,45% 5%,70% 1%,100% 6%,100% 94%,74% 100%,48% 95%,22% 100%,0 94%)}
</style></head><body>
<div id="cam"><canvas id="gl" width="1920" height="1080"></canvas><div id="dom"></div></div>
<div id="wipe"></div><div id="rip"></div>
<script type="module">import { start } from './film.js'; start();</script>
</body></html>
