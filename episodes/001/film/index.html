<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EP001 — What Really Hit Entry-Level Jobs in 2022</title>
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-body); }
  #stage { position: relative; width: 1920px; height: 1080px; }
  .beat { position: absolute; inset: 0; opacity: 0; }
  .beat.on { opacity: 1; }
  .pad { position: absolute; left: var(--margin); right: var(--margin); top: var(--margin); bottom: var(--margin); }
  .big { font-family: var(--font-number); font-size: var(--size-number); line-height: 1; color: var(--accent); letter-spacing: -0.02em; }
  .title { font-size: var(--size-title); font-weight: 700; line-height: 1.05; }
  .body { font-size: var(--size-body); line-height: 1.3; max-width: 1400px; }
  .src { font-family: var(--font-number); font-size: var(--size-source); color: var(--ink-muted); letter-spacing: 0.02em; }
  .card { width: 1400px; background: var(--surface); border: 1px solid #2a2e38; border-radius: 12px; padding: 56px 64px; box-sizing: border-box; }
  .card .head { font-size: 60px; font-weight: 700; line-height: 1.15; }
  .card .hl { background: linear-gradient(var(--accent), var(--accent)) no-repeat 0 85% / var(--hlw, 0%) 22%; }
  .tag { display: inline-block; font-family: var(--font-number); font-size: 26px; color: var(--bg); background: var(--estimate); padding: 6px 14px; border-radius: 6px; margin-left: 20px; vertical-align: middle; }
  .img { position: absolute; inset: 0; background: center / contain no-repeat; mix-blend-mode: lighten; -webkit-mask-image: radial-gradient(ellipse at center, #000 55%, transparent 78%); mask-image: radial-gradient(ellipse at center, #000 55%, transparent 78%); }
  .strike { position: absolute; left: 0; top: 54%; height: 10px; background: var(--chart-3); width: var(--sw, 0); }
  canvas { position: absolute; left: 0; top: 0; }
  .center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; }
  .foot { position: absolute; left: var(--margin); bottom: 56px; }
  .end { font-family: var(--font-number); font-size: 72px; letter-spacing: 0.18em; color: var(--ink); }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
import { seg, eo, eio, ss, clamp } from '/core/lib.js';

const cues = await (await fetch('cues.json')).json();
window.DUR = cues.dur;
const stage = document.getElementById('stage');
const T = {  // tokens read once from CSS
  bg: '#0f1115', surface: '#171a21', ink: '#e8e6df', muted: '#9a9890', accent: '#e5b650', c1: '#e5b650', c2: '#6f8fb0', c3: '#c75b4a', est: '#9a9890',
  mono: getComputedStyle(document.documentElement).getPropertyValue('--font-number').trim(),
  body: getComputedStyle(document.documentElement).getPropertyValue('--font-body').trim(),
};

// —— beat builders: each returns {el, draw(p, lt)} ; p = 0→1 over the beat, lt = seconds since beat start ——
const el = (html, cls = '') => { const d = document.createElement('div'); d.className = 'beat ' + cls; d.innerHTML = html; stage.appendChild(d); return d; };
const fadeUp = (node, p, d = 0, dist = 40) => { const q = eo(seg(p, d, d + .25)); node.style.opacity = q; node.style.transform = `translateY(${(1 - q) * dist}px)`; };

function textBeat(lines, opts = {}) {
  const d = el(`<div class="center"><div style="text-align:${opts.align || 'center'}">${lines.map((s, i) => `<div class="${opts.cls || 'title'}" data-i="${i}" style="margin:14px 0;${opts.style || ''}">${s}</div>`).join('')}</div></div>`);
  const rows = [...d.querySelectorAll('[data-i]')];
  return { el: d, draw: p => rows.forEach((r, i) => fadeUp(r, p, i * 0.08)) };
}
function bigNumber(num, label, src) {
  const d = el(`<div class="center"><div><div class="big"></div><div class="body" style="margin-top:24px">${label}</div><div class="src" style="margin-top:40px">${src}</div></div></div>`);
  const n = d.querySelector('.big'), target = parseFloat(num), suffix = num.replace(/[\d.]/g, '');
  return { el: d, draw: p => { const q = eo(seg(p, 0, .5)); n.textContent = (target * q).toFixed(num.includes('.') ? 1 : 0) + suffix; fadeUp(d.querySelector('.body'), p, .3); fadeUp(d.querySelector('.src'), p, .4); } };
}
function article(source, headline, note = '') {
  const d = el(`<div class="center"><div class="card"><div class="src">${source}</div><div class="head" style="margin-top:20px"><span class="hl">${headline}</span></div>${note ? `<div class="body" style="margin-top:28px;color:var(--ink-muted)">${note}</div>` : ''}</div></div>`);
  const card = d.querySelector('.card'), hl = d.querySelector('.hl');
  return { el: d, draw: (p, lt) => { fadeUp(card, p, 0, 30); card.style.transform += ` scale(${1 + 0.015 * clamp(lt / 12)})`; hl.style.setProperty('--hlw', `${100 * ss(seg(lt, 1.0, 2.6))}%`); } };
}
function image(file, caption = '', zoom = 1.06) {
  const d = el(`<div class="img" style="background-image:url(assets/${file})"></div>${caption ? `<div class="foot src">${caption}</div>` : ''}`);
  const im = d.querySelector('.img');
  return { el: d, draw: (p, lt) => { im.style.opacity = eo(seg(p, 0, .15)); im.style.transform = `scale(${1 + (zoom - 1) * clamp(lt / 20)})`; } };
}
function strikeText(text, after) {
  const d = el(`<div class="center"><div style="position:relative;display:inline-block"><div class="title" style="font-size:112px">${text}</div><div class="strike"></div></div><div class="body" style="position:absolute;bottom:200px;left:0;right:0;text-align:center;color:var(--accent)">${after}</div></div>`);
  const s = d.querySelector('.strike'), a = d.querySelector('.body');
  return { el: d, draw: p => { s.style.setProperty('--sw', `${100 * ss(seg(p, .45, .7))}%`); fadeUp(a, p, .72); } };
}
function canvasBeat(draw) {
  const d = el('<canvas width="1920" height="1080"></canvas>'); const c = d.querySelector('canvas').getContext('2d');
  return { el: d, draw: (p, lt) => { c.clearRect(0, 0, 1920, 1080); draw(c, p, lt); } };
}
// chart helpers
const font = (c, size, mono = false, weight = 400) => { c.font = `${weight} ${size}px ${mono ? T.mono : T.body}`; };
function bars(c, p, groups, opts) {  // groups: [{label, vals:[{v,color,name}]}]
  const x0 = 260, y0 = 820, w = 1400, h = 520, max = opts.max, bw = opts.bw || 150, gap = 70;
  c.fillStyle = T.ink; font(c, 60, false, 700); c.fillText(opts.title, x0, 150);
  c.fillStyle = T.muted; font(c, 28, true); c.fillText(opts.src, x0, 1000);
  let x = x0 + 60;
  groups.forEach((g, gi) => {
    const q = eo(seg(p, gi * .15, gi * .15 + .45));
    g.vals.forEach((v, i) => {
      const bh = h * (v.v / max) * q, bx = x + i * (bw + 24);
      c.fillStyle = v.color; c.fillRect(bx, y0 - bh, bw, bh);
      c.fillStyle = T.ink; font(c, 44, true); c.textAlign = 'center'; c.fillText(v.name, bx + bw / 2, y0 - bh - 18);
      c.fillStyle = T.muted; font(c, 30, true); c.fillText(v.sub || '', bx + bw / 2, y0 + 46); c.textAlign = 'left';
    });
    c.fillStyle = T.ink; font(c, 36); c.textAlign = 'center'; c.fillText(g.label, x + (g.vals.length * (bw + 24) - 24) / 2, y0 + 100); c.textAlign = 'left';
    x += g.vals.length * (bw + 24) + gap + 120;
  });
}
function lineChart(c, p, series, opts) {  // series: [{name,color,pts:[[x,y]]}] x in 0..1 (time), y value
  const x0 = 260, x1 = 1660, y0 = 860, y1 = 260, ymin = opts.ymin, ymax = opts.ymax;
  c.fillStyle = T.ink; font(c, 60, false, 700); c.fillText(opts.title, x0, 150);
  c.strokeStyle = '#2a2e38'; c.lineWidth = 2; [0, .5, 1].forEach(f => { const y = y0 - (y1 - y0) * -f; c.beginPath(); c.moveTo(x0, y0 + (y1 - y0) * f); c.lineTo(x1, y0 + (y1 - y0) * f); c.stroke(); });
  (opts.xlabels || []).forEach(([f, s]) => { c.fillStyle = T.muted; font(c, 28, true); c.textAlign = 'center'; c.fillText(s, x0 + (x1 - x0) * f, y0 + 50); c.textAlign = 'left'; });
  const reveal = eo(seg(p, .05, .7));
  series.forEach(s => {
    c.strokeStyle = s.color; c.lineWidth = 8; c.lineJoin = 'round'; c.beginPath();
    s.pts.forEach(([fx, v], i) => { if (fx > reveal + 1e-6) return; const X = x0 + (x1 - x0) * fx, Y = y0 + (y1 - y0) * ((v - ymin) / (ymax - ymin)); i ? c.lineTo(X, Y) : c.moveTo(X, Y); });
    c.stroke();
    const last = s.pts.filter(([fx]) => fx <= reveal + 1e-6).at(-1); if (!last) return;
    const X = x0 + (x1 - x0) * last[0], Y = y0 + (y1 - y0) * ((last[1] - ymin) / (ymax - ymin));
    c.fillStyle = s.color; c.beginPath(); c.arc(X, Y, 12, 0, 7); c.fill(); font(c, 36, true); const lbl = s.name + (s.fmt ? ' ' + s.fmt(last[1]) : ''); if (last[0] > .75) { c.textAlign = 'right'; c.fillText(lbl, X - 24, Y - 24); c.textAlign = 'left'; } else c.fillText(lbl, X + 24, Y + 12);
  });
  c.fillStyle = T.muted; font(c, 28, true); c.fillText(opts.src, x0, 1000);
  if (opts.note) { c.fillStyle = T.accent; font(c, 36); c.fillText(opts.note, x0, 215); }
}
function donut(c, p, frac, label, src, est) {
  const q = eio(seg(p, .05, .6)), cx = 760, cy = 540, r = 300;
  c.lineWidth = 70; c.strokeStyle = '#2a2e38'; c.beginPath(); c.arc(cx, cy, r, 0, 7); c.stroke();
  c.strokeStyle = T.accent; c.beginPath(); c.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * frac * q); c.stroke();
  c.fillStyle = T.accent; font(c, 150, true); c.textAlign = 'center'; c.fillText(Math.round(frac * 100 * q) + '%', cx, cy + 50); c.textAlign = 'left';
  c.fillStyle = T.ink; font(c, 48); label.forEach((s, i) => c.fillText(s, 1180, 440 + i * 70));
  if (est) { c.fillStyle = T.est; c.fillRect(1180, 640, 230, 56); c.fillStyle = T.bg; font(c, 30, true); c.fillText('ESTIMATE', 1205, 679); }
  c.fillStyle = T.muted; font(c, 28, true); c.fillText(src, 260, 1000);
}
function timeline(c, p, items, opts) {  // items: [{f0,f1,label,color,row}]
  const x0 = 260, x1 = 1660, baseY = 560;
  c.fillStyle = T.ink; font(c, 60, false, 700); c.fillText(opts.title, x0, 150);
  c.strokeStyle = T.ink; c.lineWidth = 3; c.beginPath(); c.moveTo(x0, baseY); c.lineTo(x1, baseY); c.stroke();
  (opts.marks || []).forEach(([f, s], i) => { const X = x0 + (x1 - x0) * f, q = eo(seg(p, .05 + i * .08, .25 + i * .08)); c.globalAlpha = q; c.fillStyle = T.ink; c.beginPath(); c.arc(X, baseY, 10, 0, 7); c.fill(); font(c, 28, true); c.textAlign = 'center'; c.fillText(s, X, baseY + 56); c.textAlign = 'left'; c.globalAlpha = 1; });
  items.forEach((it, i) => { const q = eo(seg(p, .3 + i * .2, .6 + i * .2)), X0 = x0 + (x1 - x0) * it.f0, X1 = X0 + (x1 - x0) * (it.f1 - it.f0) * q, Y = baseY - 90 - it.row * 110;
    c.globalAlpha = .85; c.fillStyle = it.color; c.fillRect(X0, Y - 36, X1 - X0, 72); c.globalAlpha = 1; c.fillStyle = T.bg; font(c, 34, false, 700); if (q > .5) c.fillText(it.label, X0 + 20, Y + 12); });
  c.fillStyle = T.muted; font(c, 28, true); c.fillText(opts.src, x0, 1000);
}
function desksApart(c, p) {  // two desks sliding apart, speech bubbles shrinking
  const q = ss(seg(p, .15, .7)), gap = 80 + 700 * q;
  const desk = (x, y, person) => { c.fillStyle = T.ink; c.fillRect(x - 160, y, 320, 22); c.fillRect(x - 140, y + 22, 18, 120); c.fillRect(x + 122, y + 22, 18, 120); if (person) { c.beginPath(); c.arc(x, y - 110, 42, 0, 7); c.fill(); c.fillRect(x - 60, y - 70, 120, 72); } };
  desk(960 - gap, 600, true); desk(960 + gap, 600, false);
  const bub = (x, y, s) => { c.fillStyle = T.accent; c.beginPath(); c.ellipse(x, y, 90 * s, 50 * s, 0, 0, 7); c.fill(); };
  const s = 1 - .8 * q; bub(960 - gap + 120, 430, s); bub(960 + gap - 120, 430, s * .9);
  c.fillStyle = T.muted; font(c, 36, true); c.textAlign = 'center'; c.fillText(q > .6 ? 'feedback and mentoring drop with distance' : 'feedback · mentoring', 960, 900); c.textAlign = 'left';
  c.fillStyle = T.muted; font(c, 28, true); c.fillText('Source: NY Fed Liberty Street Economics, one Fortune 500 firm', 260, 1000);
}
function splitJobs(c, p, left, right, note) {
  const q = eo(seg(p, .05, .4)); c.fillStyle = '#2a2e38'; c.fillRect(958, 200, 4, 680 * q);
  [[480, left, T.c1], [1440, right, T.c2]].forEach(([x, [h, s, icon], col], i) => { const r = eo(seg(p, .2 + i * .15, .5 + i * .15)); c.globalAlpha = r;
    c.fillStyle = col; font(c, 120, true); c.textAlign = 'center'; c.fillText(icon, x, 470); c.fillStyle = T.ink; font(c, 52, false, 700); c.fillText(h, x, 600); c.fillStyle = T.muted; font(c, 36); c.fillText(s, x, 670); c.textAlign = 'left'; c.globalAlpha = 1; });
  if (note) { c.fillStyle = T.accent; font(c, 40); c.textAlign = 'center'; c.fillText(note, 960, 900); c.textAlign = 'left'; }
}
function deskRow(c, p) {  // five empty desks, one lamp lit
  for (let i = 0; i < 5; i++) { const x = 360 + i * 300, q = eo(seg(p, i * .08, i * .08 + .3)); c.globalAlpha = q; c.fillStyle = T.ink; c.fillRect(x - 110, 560, 220, 16); c.fillRect(x - 96, 576, 12, 100); c.fillRect(x + 84, 576, 12, 100); c.fillStyle = '#2a2e38'; c.beginPath(); c.arc(x, 500, 34, 0, 7); c.fill(); c.fillRect(x - 40, 520, 80, 40); }
  c.globalAlpha = 1; const l = eo(seg(p, .5, .8)); c.fillStyle = T.accent; c.globalAlpha = l; c.beginPath(); c.moveTo(960, 470); c.lineTo(900, 560); c.lineTo(1020, 560); c.closePath(); c.fill(); c.globalAlpha = 1;
  c.fillStyle = T.muted; font(c, 36, true); c.textAlign = 'center'; c.fillText('the common version: the first rung disappeared', 960, 900); c.textAlign = 'left';
}

// —— the film: one beat per narration line, keyed by line id ——
const SRC_NYF = 'Source: NY Fed, Liberty Street Economics, June 1, 2026';
const SRC_CLM = 'Source: NY Fed, The Labor Market for Recent College Graduates, 2026 Q2';
const SRC_STAN = 'Source: Stanford Digital Economy Lab, Aug 12, 2026 (ADP payroll data)';
const SRC_CEN = 'Source: U.S. Census Bureau, CES-WP-26-27 (April 2026)';
const SRC_FRED = 'Source: FRED, Federal Funds Effective Rate (monthly)';
const B = {
  s1_01: [ image('graduate_rejections.png'), strikeText('"AI took the entry-level jobs"', 'A New York Fed study says the trouble started earlier.'), article('Liberty Street Economics · June 1, 2026', 'Remote Work Leaves Younger Workers Sidelined') ],
  s2_01: [ image('ladder_missing_rung.png'), canvasBeat(deskRow) ],
  s2_02: [ textBeat(['Young graduates are struggling.', 'That part is true.', 'The question is why.']) ],
  s2_03: [ article('Liberty Street Economics · June 1, 2026', 'Emanuel · Harrington · Pallais', 'Federal Reserve Bank of New York · University of Virginia · Harvard') ],
  s2_04: [ textBeat(['A change that came before AI tools were in wide use.', 'A second study adds a newer problem on top.'], { cls: 'body', style: 'font-size:56px' }), textBeat(['THE FIRST PROBLEM', "WASN'T AI"], { style: 'font-size:132px;color:var(--accent)' }) ],
  s3_01: [ textBeat(['Start with the gap itself.']) ],
  s3_02: [ bigNumber('5.6%', 'unemployment rate, recent college graduates (age 22–27), 2026 Q2', SRC_CLM), bigNumber('42%', 'of recent graduates underemployed (a job that does not need a degree)', SRC_CLM) ],
  s3_03: [ canvasBeat((c, p) => bars(c, p, [{ label: '2017–19', vals: [{ v: 3.1, color: T.c1, name: '3.1%' }] }, { label: '2022–25', vals: [{ v: 3.7, color: T.c1, name: '3.7%' }] }], { title: 'Unemployment, college graduates under 29', src: SRC_NYF, max: 4.2, bw: 220 })) ],
  s3_04: [ canvasBeat((c, p) => bars(c, p, [{ label: 'under 29', vals: [{ v: 3.1, color: T.c1, name: '3.1%', sub: '2017–19' }, { v: 3.7, color: T.c1, name: '3.7%', sub: '2022–25' }] }, { label: 'older graduates', vals: [{ v: 1.9, color: T.c2, name: '1.9%', sub: '2017–19' }, { v: 1.8, color: T.c2, name: '1.8%', sub: '2022–25' }] }], { title: 'Young graduates rose, older graduates edged down', src: SRC_NYF, max: 4.2 })) ],
  s3_05: [ textBeat(['A weak economy alone would not single out the youngest.', 'Juniors replaced, seniors stay?', 'That fits the AI story. So the researchers looked closer.'], { cls: 'body', style: 'font-size:54px' }) ],
  s4_01: [ canvasBeat((c, p) => splitJobs(c, p, ['Jobs you can do from home', 'e.g. software engineering', '⌂'], ['Jobs where you show up', 'e.g. mechanical engineering', '⚙'], 'sorted by a published remotability index')) ],
  s4_02: [ textBeat(['Young vs. older workers,', 'inside each group.']) ],
  s4_03: [ canvasBeat((c, p) => lineChart(c, p, [{ name: 'young graduates', color: T.c1, pts: [[0, 0], [.5, .35], [1, .95]], fmt: v => '+' + v.toFixed(1) + ' pt' }, { name: 'older workers', color: T.c2, pts: [[0, 0], [.5, -.05], [1, -.1]], fmt: v => v.toFixed(1) + ' pt' }], { title: 'From-home jobs: change in unemployment', ymin: -.4, ymax: 1.2, xlabels: [[0, '2017–19'], [1, '2022–24']], src: SRC_NYF, note: 'young graduates: up almost a full percentage point' })) ],
  s4_04: [ canvasBeat((c, p) => lineChart(c, p, [{ name: 'young − older gap', color: T.c1, pts: [[0, 0], [.3, .05], [.45, .6], [.6, .15], [1, .05]] }], { title: 'Show-up jobs: the gap bumped in 2020, then returned', ymin: -.4, ymax: 1.2, xlabels: [[0, '2017'], [.45, '2020'], [1, '2024']], src: SRC_NYF })) ],
  s4_05: [ textBeat(['The gap opened where work went remote.', 'It did not open where work stayed in person.', 'Remote work: about four-fold since the pandemic.'], { cls: 'body', style: 'font-size:56px' }) ],
  s4_06: [ canvasBeat((c, p) => timeline(c, p, [{ f0: 0, f1: .3, label: 'baseline 2017–19', color: T.c2, row: 0 }, { f0: .62, f1: .92, label: 'comparison 2022–24', color: T.c1, row: 0 }], { title: 'The rise began before generative AI was in wide use', marks: [[.38, '2020 remote shift'], [.69, 'Nov 2022 ChatGPT']], src: SRC_NYF })) ],
  s5_01: [ textBeat(['Why would working from home', 'hurt new hires most?']) ],
  s5_02: [ canvasBeat(desksApart) ],
  s5_03: [ textBeat(['A junior job is partly work', 'and partly training.']) ],
  s5_04: [ article('NY Fed · Liberty Street Economics', '“shies away from employing inexperienced workers if distance creates barriers to training and development”') ],
  s5_05: [ article('Two cautions', 'Evidence: one company · wording: “can explain”, “has meaningfully contributed”', 'An argument, not a closed case.') ],
  s6_01: [ textBeat(['How much does remote work', 'account for?']) ],
  s6_02: [ canvasBeat((c, p) => donut(c, p, .64, ['of the recent increase in', 'young graduate unemployment', 'can be explained by remote work'], SRC_NYF, true)) ],
  s6_03: [ textBeat(['AI exposure held constant', '→ the gap persists'], { style: 'color:var(--accent)' }) ],
  s6_04: [ textBeat(['The first problem:', 'jobs that went remote.'], {}) ],
  s6_05: [ textBeat(['A second study looks at the same years', 'and finds something else.'], { cls: 'body', style: 'font-size:56px' }) ],
  s7_01: [ article('Stanford Digital Economy Lab · Aug 12, 2026', 'Brynjolfsson, Chandar, Chen — ADP payroll data', 'Workers aged 22–25 in the occupations most exposed to AI') ],
  s7_02: [ canvasBeat((c, p) => lineChart(c, p, [{ name: 'gap', color: T.c3, pts: [[0, 15], [1, 19]], fmt: v => v.toFixed(0) + '%' }], { title: 'Young workers in AI-exposed jobs: employment gap', ymin: 0, ymax: 24, xlabels: [[0, 'July 2025 data'], [1, 'June 2026 data']], src: SRC_STAN, note: '15% → 19%, relative to less-exposed jobs' })) ],
  s7_03: [ textBeat(['Holds up with interest rates and remote work controlled for.', 'No comparable gap for experienced workers.'], { cls: 'body', style: 'font-size:54px' }) ],
  s7_04: [ canvasBeat((c, p) => bars(c, p, [{ label: 'most AI-exposed industries', vals: [{ v: 12, color: T.c3, name: '−12%' }] }, { label: 'less exposed', vals: [{ v: .4, color: T.c2, name: 'steady' }] }], { title: 'Workers aged 22–24, ten quarters after ChatGPT', src: SRC_CEN, max: 14, bw: 220 })) ],
  s7_05: [ canvasBeat((c, p) => splitJobs(c, p, ['AI does the task', 'young employment declines', '⤓'], ['AI helps the worker', 'flat or rising', '⤴'], 'the gap is not spread evenly across jobs')) ],
  s7_06: [ article('Stanford authors’ cautions', '“descriptive patterns, not causal estimates”', 'Some differences predate wide AI use · smaller when education is controlled · payroll sample shows larger gaps than national surveys') ],
  s7b_01: [ textBeat(['A third suspect:', 'interest rates.']) ],
  s7b_02: [ canvasBeat((c, p) => lineChart(c, p, [{ name: 'fed funds', color: T.c1, pts: [[0, .08], [.1, .2], [.35, 4.3], [.42, 5.33], [.68, 5.33], [.9, 3.72], [1, 3.75]], fmt: v => v.toFixed(2) + '%' }], { title: 'Federal funds effective rate', ymin: 0, ymax: 6, xlabels: [[0, 'Jan 2022'], [.42, 'Aug 2023'], [1, 'Sep 2026']], src: SRC_FRED })) ],

// a line with several beats splits its time evenly between them
const plan = cues.lines.map(l => { const bs = B[l.id] || [textBeat([''])]; const n = bs.length, len = (l.t1 - l.t0 + 0.5) / n; return bs.map((b, i) => ({ b: b.el ? b : { el: b, draw: () => {} }, t0: l.t0 + i * len, t1: l.t0 + (i + 1) * len })); }).flat();
plan.at(-1).t1 = cues.dur;
const XF = 0.35;  // cut with a short fade
window.render = t => {
  for (const { b, t0, t1 } of plan) {
    const on = t >= t0 && t < t1;
    b.el.style.opacity = on ? Math.min(eo(seg(t, t0, t0 + XF)), 1 - seg(t, t1 - XF, t1)) : 0;
    if (on) b.draw(clamp((t - t0) / 2.5), t - t0);  // 첫 인자 = 등장 진행도(2.5초), 둘째 = 경과 초
  }
};
await document.fonts.ready;
await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
window.render(0);
window.READY = true;
