<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EP001 v2 — What Really Hit Entry-Level Jobs in 2022</title>
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-body); }
  #stage { position: relative; width: 1920px; height: 1080px; }
  .cut { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
  .cut.blurred { opacity: 1; filter: blur(18px) brightness(.4) saturate(.6); }
  .fill { position: absolute; inset: 0; }
  .fill img { width: 1920px; height: 1080px; display: block; }
  .hl { position: absolute; background: var(--accent); opacity: .45; mix-blend-mode: multiply; border-radius: 4px; transform-origin: left center; }
  .src { position: absolute; left: 40px; bottom: 32px; font-family: var(--font-number); font-size: 26px; color: #fff; background: rgba(0,0,0,.55); padding: 8px 14px; border-radius: 6px; letter-spacing: .02em; }
  .center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; }
  .card { background: rgba(23,26,33,.92); border: 1px solid #2a2e38; border-radius: 14px; padding: 48px 64px; max-width: 1400px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .card .t { font-size: 84px; font-weight: 700; line-height: 1.1; }
  .card .t.big { font-size: 128px; color: var(--accent); letter-spacing: -.01em; }
  .card .sub { font-size: 40px; color: var(--ink-muted); margin-top: 20px; }
  .card .end { font-family: var(--font-number); font-size: 72px; letter-spacing: .18em; }
  .topic { position: absolute; left: 40px; bottom: 32px; font-family: var(--font-number); font-size: 24px; color: var(--ink-muted); }
  .toplabel { position: absolute; left: var(--margin); top: 72px; font-size: 48px; font-weight: 700; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  .img { position: absolute; inset: 0; background: center / contain no-repeat; mix-blend-mode: lighten; -webkit-mask-image: radial-gradient(ellipse at center, #000 55%, transparent 78%); mask-image: radial-gradient(ellipse at center, #000 55%, transparent 78%); }
  canvas { position: absolute; left: 0; top: 0; }
  .ui { position: absolute; inset: 0; }
  .box { position: absolute; background: var(--surface); border: 1px solid #2a2e38; border-radius: 12px; padding: 28px 36px; font-size: 40px; }
  .mono { font-family: var(--font-number); }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
import { seg, eo, eio, ss, clamp } from '/core/lib.js';
const data = await (await fetch('cuts.json')).json();
const CUTS = data.cuts, SRC = data.src;
window.DUR = CUTS.at(-1).t + CUTS.at(-1).d;
const stage = document.getElementById('stage');
const T = { bg: '#0f1115', surface: '#171a21', ink: '#e8e6df', muted: '#9a9890', accent: '#e5b650', c1: '#e5b650', c2: '#6f8fb0', c3: '#c75b4a', est: '#9a9890',
  mono: getComputedStyle(document.documentElement).getPropertyValue('--font-number').trim(), body: getComputedStyle(document.documentElement).getPropertyValue('--font-body').trim() };
const MARKS = {};
for (const pg of Object.keys(SRC)) { try { MARKS[pg] = await (await fetch(`pages/${pg}_marks.json`)).json(); } catch { MARKS[pg] = {}; } }
const markOf = (pg, m) => { const v = Object.values(MARKS[pg] || {}); return (m != null && v[m]) || null; };

const el = (html) => { const d = document.createElement('div'); d.className = 'cut'; d.innerHTML = html; stage.appendChild(d); return d; };
const pop = (node, e, delay = 0) => { const q = seg(e, delay, delay + .5); node.style.opacity = q; node.style.transform = `scale(${0.9 + 0.1 * eo(q)}) translateY(${(1 - eo(q)) * 24}px)`; };
const font = (c, size, mono = false, weight = 400) => { c.font = `${weight} ${size}px ${mono ? T.mono : T.body}`; };
const srcLabel = (pg) => `<div class="src">${SRC[pg] || ''}</div>`;

// ——— renderers: each returns draw(e, lt, p): e = entrance 0→1 over 1.2 s, lt = seconds in cut, p = 0→1 over the cut ———
function PAGE(c) {
  const mk = markOf(c.pg, c.m), file = mk ? mk.file : `${c.pg}.png`;
  const d = el(`<div class="fill"><img src="pages/${file}"></div>${mk ? '<div class="hl"></div>' : ''}${srcLabel(c.pg)}`);
  const f = d.querySelector('.fill'), hl = d.querySelector('.hl');
  if (hl) Object.assign(hl.style, { left: (mk.x - 8) + 'px', top: (mk.y - 4) + 'px', width: (mk.w + 16) + 'px', height: (mk.h + 8) + 'px' });
  const ox = mk ? clamp(mk.x + mk.w / 2, 300, 1620) : 960, oy = mk ? clamp(mk.y + mk.h / 2, 200, 880) : 540;
  f.style.transformOrigin = `${ox}px ${oy}px`;
  return (e, lt, p) => {
    const s = c.z === 'snap' ? 1.3 - 0.22 * eo(seg(lt, 0, .35)) : 1.0 + 0.07 * p + (mk ? 0.06 : 0);
    f.style.transform = `scale(${s})`;
    if (hl) { hl.style.transform = `scale(${ss(seg(lt, .5, 1.3))}, 1)`; }
  };
}
function CARD(c) {
  const inner = c.end ? `<div class="end">${c.text}</div>` : `<div class="t ${c.big ? 'big' : ''}"></div>${c.sub ? `<div class="sub">${c.sub}</div>` : ''}`;
  const d = el(`<div class="center" style="justify-content:${c.pos === 'l' ? 'flex-start' : c.pos === 'r' ? 'flex-end' : 'center'};padding:0 160px"><div class="card">${inner}</div></div>`);
  const card = d.querySelector('.card'), t = d.querySelector('.t');
  return (e, lt, p) => {
    pop(card, e);
    if (!t) return;
    let txt = c.text;
    if (c.swap && p > .5) txt = c.swap;
    if (c.typing) txt = c.text.slice(0, Math.ceil(c.text.length * seg(lt, .2, 1.8)));
    if (t.textContent !== txt) t.textContent = txt;
    if (c.big) card.style.transform += ` scale(${1 + 0.02 * p})`;
  };
}
function CUT(c) {
  const d = el(`<div class="img" style="background-image:url(assets/${c.f})"></div>${c.label ? `<div class="toplabel">${c.label}</div>` : ''}`);
  const im = d.querySelector('.img');
  return (e, lt, p) => { im.style.opacity = eo(seg(lt, 0, .3)); im.style.transform = `scale(${1 + 0.08 * p})`; };
}
function STOCK(c) {  // 자리표시: 스톡 클립이 들어오기 전까지 추상 사무실 창 격자가 천천히 흐른다
  const d = el(`<canvas width="1920" height="1080"></canvas>${c.label ? `<div class="toplabel">${c.label}</div>` : ''}<div class="topic">[stock placeholder] ${c.topic}</div>`);
  const g = d.querySelector('canvas').getContext('2d'); const seed = [...c.topic].reduce((a, ch) => a + ch.charCodeAt(0), 0);
  return (e, lt, p) => {
    g.clearRect(0, 0, 1920, 1080); g.fillStyle = '#12151b'; g.fillRect(0, 0, 1920, 1080);
    const pan = 60 * p, zoom = 1 + 0.05 * p;
    for (let i = 0; i < 48; i++) { const col = i % 8, row = Math.floor(i / 8), on = ((seed * (i + 7)) % 11) < 4;
      const x = (120 + col * 230 - pan) * zoom, y = (120 + row * 150) * zoom; g.fillStyle = on ? 'rgba(229,182,80,.14)' : 'rgba(255,255,255,.04)'; g.fillRect(x, y, 170 * zoom, 100 * zoom); }
    const grd = g.createLinearGradient(0, 600, 0, 1080); grd.addColorStop(0, 'rgba(15,17,21,0)'); grd.addColorStop(1, 'rgba(15,17,21,1)'); g.fillStyle = grd; g.fillRect(0, 600, 1920, 480);
  };
}
function TL(c) {
  const d = el('<canvas width="1920" height="1080"></canvas>'); const g = d.querySelector('canvas').getContext('2d');
  const V = {
    ai_marker: { title: 'When did it start?', marks: [[.0, '2017'], [.69, 'Nov 2022 ChatGPT'], [1, '2026']], items: [] },
    baseline: { title: 'The comparison window', marks: [[0, '2017'], [1, '2024']], items: [{ f0: 0, f1: .3, label: 'baseline 2017–19', color: T.c2, row: 0 }] },
    comparison: { title: 'The comparison window', marks: [[0, '2017'], [1, '2024']], items: [{ f0: 0, f1: .3, label: 'baseline 2017–19', color: T.c2, row: 0 }, { f0: .62, f1: 1, label: 'comparison 2022–24', color: T.c1, row: 0 }] },
    chatgpt: { title: 'The rise began before generative AI was in wide use', marks: [[.38, '2020 remote shift'], [.69, 'Nov 2022 ChatGPT']], items: [{ f0: 0, f1: .3, label: 'baseline 2017–19', color: T.c2, row: 0 }, { f0: .62, f1: 1, label: 'comparison 2022–24', color: T.c1, row: 0 }] },
    through2024: { title: 'The first problem, through 2024', marks: [[0, '2017'], [1, '2024']], items: [{ f0: .25, f1: 1, label: 'remote work · mentoring gap', color: T.c2, row: 0 }] },
    before_ai: { title: 'Some differences predate wide AI use', marks: [[.5, 'Nov 2022 ChatGPT']], items: [{ f0: .2, f1: .5, label: 'before', color: T.c2, row: 0 }, { f0: .5, f1: 1, label: 'after', color: T.c1, row: 0 }] },
    two_bands_1: { title: 'Two overlapping problems', marks: [[.52, 'Nov 2022'], [1, 'Jun 2026']], items: [{ f0: 0, f1: .66, label: 'NY Fed: remote work', color: T.c2, row: 1 }] },
    two_bands_2: { title: 'Two overlapping problems', marks: [[.52, 'Nov 2022'], [1, 'Jun 2026']], items: [{ f0: 0, f1: .66, label: 'NY Fed: remote work', color: T.c2, row: 1 }, { f0: .52, f1: 1, label: 'Stanford: AI-exposed jobs', color: T.c1, row: 0 }] },
    stacking: { title: 'Two or more causes, stacking', marks: [[.52, 'Nov 2022'], [1, 'Jun 2026']], items: [{ f0: 0, f1: .66, label: 'remote work', color: T.c2, row: 1 }, { f0: .52, f1: 1, label: 'AI does the task', color: T.c1, row: 0 }, { f0: .3, f1: .75, label: 'interest rates (up to ¼, Census)', color: T.est, row: 2 }] },
  }[c.v];
  return (e, lt, p) => { g.clearRect(0, 0, 1920, 1080); timeline(g, clamp(lt / 2.2), V.items, V); };
}
function CHART(c) {
  const d = el('<canvas width="1920" height="1080"></canvas>'); const g = d.querySelector('canvas').getContext('2d');
  const fn = CHARTS[c.c]; if (!fn) throw new Error('chart ' + c.c);
  return (e, lt, p) => { g.clearRect(0, 0, 1920, 1080); fn(g, clamp(lt / Math.min(c.d, 3.5)), lt, p); };
}
function UI(c) { const fn = UIS[c.tpl]; if (!fn) throw new Error('ui ' + c.tpl); return fn(c); }

// ——— chart helpers ———
const S_NYF = 'Source: NY Fed, Liberty Street Economics (Jun 1, 2026)', S_CLM = 'Source: NY Fed, Labor Market for Recent College Graduates (2026 Q2)', S_STAN = 'Source: Stanford Digital Economy Lab (Aug 12, 2026), ADP payroll data', S_CEN = 'Source: U.S. Census Bureau, CES-WP-26-27', S_FRED = 'Source: FRED, FEDFUNDS (monthly)';
function titleSrc(g, title, src) { g.fillStyle = T.ink; font(g, 56, false, 700); g.textAlign = 'left'; g.fillText(title, 260, 150); g.fillStyle = T.muted; font(g, 26, true); g.fillText(src, 260, 1000); }
function bars(g, q, groups, o) {
  titleSrc(g, o.title, o.src); const y0 = 820, h = 520, bw = o.bw || 170; let x = 360;
  groups.forEach((gr, gi) => { const qq = eo(seg(q, gi * .25, gi * .25 + .6));
    gr.vals.forEach((v, i) => { const bh = h * (Math.abs(v.v) / o.max) * qq, bx = x + i * (bw + 24); g.fillStyle = v.color; g.fillRect(bx, y0 - bh, bw, bh);
      g.fillStyle = T.ink; font(g, 44, true); g.textAlign = 'center'; g.fillText(v.name, bx + bw / 2, y0 - bh - 18); g.fillStyle = T.muted; font(g, 28, true); g.fillText(v.sub || '', bx + bw / 2, y0 + 46); });
    g.fillStyle = T.ink; font(g, 34); g.textAlign = 'center'; g.fillText(gr.label, x + (gr.vals.length * (bw + 24) - 24) / 2, y0 + 100); x += gr.vals.length * (bw + 24) + 200; });
  g.textAlign = 'left';
}
function lineChart(g, q, series, o) {
  titleSrc(g, o.title, o.src); const x0 = 260, x1 = 1560, y0 = 860, y1 = 280;
  g.strokeStyle = '#2a2e38'; g.lineWidth = 2; [0, .5, 1].forEach(f => { g.beginPath(); g.moveTo(x0, y0 + (y1 - y0) * f); g.lineTo(x1, y0 + (y1 - y0) * f); g.stroke(); });
  (o.xlabels || []).forEach(([f, s]) => { g.fillStyle = T.muted; font(g, 28, true); g.textAlign = 'center'; g.fillText(s, x0 + (x1 - x0) * f, y0 + 50); });
  const reveal = eo(seg(q, .05, 1));
  series.forEach(s => { g.strokeStyle = s.color; g.lineWidth = 8; g.lineJoin = 'round'; g.beginPath();
    s.pts.forEach(([fx, v], i) => { if (fx > reveal + 1e-6) return; const X = x0 + (x1 - x0) * fx, Y = y0 + (y1 - y0) * ((v - o.ymin) / (o.ymax - o.ymin)); i ? g.lineTo(X, Y) : g.moveTo(X, Y); }); g.stroke();
    const last = s.pts.filter(([fx]) => fx <= reveal + 1e-6).at(-1); if (!last) return; const X = x0 + (x1 - x0) * last[0], Y = y0 + (y1 - y0) * ((last[1] - o.ymin) / (o.ymax - o.ymin));
    g.fillStyle = s.color; g.beginPath(); g.arc(X, Y, 12, 0, 7); g.fill(); font(g, 36, true); g.textAlign = 'left'; g.fillText(s.name + (s.fmt ? ' ' + s.fmt(last[1]) : ''), X + 24, Y + 12); });
  if (o.note) { g.fillStyle = T.accent; font(g, 36); g.textAlign = 'left'; g.fillText(o.note, 260, 215); }
  g.textAlign = 'left';
}
function donut(g, q, frac, label, src, est) {
  const cx = 700, cy = 560, r = 300, qq = eio(seg(q, .05, 1));
  g.lineWidth = 70; g.strokeStyle = '#2a2e38'; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.stroke();
  g.strokeStyle = T.accent; g.beginPath(); g.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * frac * qq); g.stroke();
  g.fillStyle = T.accent; font(g, 150, true); g.textAlign = 'center'; g.fillText(Math.round(frac * 100 * qq) + '%', cx, cy + 50); g.textAlign = 'left';
  g.fillStyle = T.ink; font(g, 46); label.forEach((s, i) => g.fillText(s, 1120, 460 + i * 68));
  if (est) { g.fillStyle = T.est; g.fillRect(1120, 660, 230, 56); g.fillStyle = T.bg; font(g, 30, true); g.fillText('ESTIMATE', 1145, 699); }
  g.fillStyle = T.muted; font(g, 26, true); g.fillText(src, 260, 1000);
}
function timeline(g, q, items, o) {
  const x0 = 260, x1 = 1660, baseY = 600; titleSrc(g, o.title, o.src || 'Sources: NY Fed; Stanford DEL; U.S. Census Bureau');
  g.strokeStyle = T.ink; g.lineWidth = 3; g.beginPath(); g.moveTo(x0, baseY); g.lineTo(x1, baseY); g.stroke();
  (o.marks || []).forEach(([f, s], i) => { const X = x0 + (x1 - x0) * f, qq = eo(seg(q, i * .1, .3 + i * .1)); g.globalAlpha = qq; g.fillStyle = T.ink; g.beginPath(); g.arc(X, baseY, 10, 0, 7); g.fill(); font(g, 28, true); g.textAlign = 'center'; g.fillText(s, X, baseY + 56); g.globalAlpha = 1; });
  items.forEach((it, i) => { const qq = eo(seg(q, .2 + i * .25, .6 + i * .25)), X0 = x0 + (x1 - x0) * it.f0, X1 = X0 + (x1 - x0) * (it.f1 - it.f0) * qq, Y = baseY - 100 - it.row * 110;
    g.globalAlpha = .85; g.fillStyle = it.color; g.fillRect(X0, Y - 36, X1 - X0, 72); g.globalAlpha = 1; g.fillStyle = T.bg; font(g, 32, false, 700); g.textAlign = 'left'; if (qq > .5) g.fillText(it.label, X0 + 20, Y + 12); });
  g.textAlign = 'left';
}
function bigNum(g, q, num, label, src) {
  const target = parseFloat(num), suffix = num.replace(/[\d.]/g, ''), qq = eo(seg(q, 0, .8));
  g.fillStyle = T.accent; font(g, 220, true); g.textAlign = 'center'; g.fillText((target * qq).toFixed(num.includes('.') ? 1 : 0) + suffix, 960, 520);
  g.fillStyle = T.ink; font(g, 46); g.fillText(label, 960, 640); g.textAlign = 'left'; g.fillStyle = T.muted; font(g, 26, true); g.fillText(src, 260, 1000);
}
function desks(g, q, apart) {
  const gap = apart ? 80 + 700 * ss(q) : 80;
  const desk = (x, y, person) => { g.fillStyle = T.ink; g.fillRect(x - 160, y, 320, 22); g.fillRect(x - 140, y + 22, 18, 120); g.fillRect(x + 122, y + 22, 18, 120); if (person) { g.beginPath(); g.arc(x, y - 110, 42, 0, 7); g.fill(); g.fillRect(x - 60, y - 70, 120, 72); } };
  desk(960 - gap, 600, true); desk(960 + gap, 600, true);
  const s = apart ? 1 - .8 * ss(q) : .6 + .4 * eo(q); g.fillStyle = T.accent;
  [[960 - gap + 120, 430], [960 + gap - 120, 430]].forEach(([x, y]) => { g.beginPath(); g.ellipse(x, y, 90 * s, 50 * s, 0, 0, 7); g.fill(); });
  g.fillStyle = T.muted; font(g, 34, true); g.textAlign = 'center'; g.fillText(apart ? 'feedback and mentoring drop with distance' : 'feedback · mentoring', 960, 900); g.textAlign = 'left';
  g.fillStyle = T.muted; font(g, 26, true); g.fillText(S_NYF + ' · one Fortune 500 firm', 260, 1000);
}
const CHARTS = {
  num_5_6: (g, q) => bigNum(g, q, '5.6%', 'unemployment, recent college graduates (22–27), 2026 Q2', S_CLM),
  num_42: (g, q) => bigNum(g, q, '42%', 'of recent graduates underemployed', S_CLM),
  num_4x: (g, q) => bigNum(g, q, '4×', 'remote work since the pandemic', S_NYF),
  bars_young_1: (g, q) => bars(g, q, [{ label: '2017–19', vals: [{ v: 3.1, color: T.c1, name: '3.1%' }] }], { title: 'Unemployment, college graduates under 29', src: S_NYF, max: 4.2, bw: 220 }),
  bars_young_2: (g, q) => bars(g, Math.min(1, .5 + q / 2), [{ label: '2017–19', vals: [{ v: 3.1, color: T.c1, name: '3.1%' }] }, { label: '2022–25', vals: [{ v: 3.7, color: T.c1, name: '3.7%' }] }], { title: 'Unemployment, college graduates under 29', src: S_NYF, max: 4.2, bw: 220 }),
  bars_young_arrow: (g, q) => { bars(g, 1, [{ label: '2017–19', vals: [{ v: 3.1, color: T.c1, name: '3.1%' }] }, { label: '2022–25', vals: [{ v: 3.7, color: T.c1, name: '3.7%' }] }], { title: 'Unemployment, college graduates under 29', src: S_NYF, max: 4.2, bw: 220 }); g.strokeStyle = T.c3; g.lineWidth = 6; g.beginPath(); g.moveTo(620, 420); g.lineTo(620 + 160 * eo(q), 400 - 60 * eo(q)); g.stroke(); g.fillStyle = T.c3; font(g, 40, true); g.fillText('+0.6 pt', 1120, 420); },
  bars_older: (g, q) => bars(g, q, [{ label: 'older graduates', vals: [{ v: 1.9, color: T.c2, name: '1.9%', sub: '2017–19' }, { v: 1.8, color: T.c2, name: '1.8%', sub: '2022–25' }] }], { title: 'Older graduates edged down', src: S_NYF, max: 4.2, bw: 220 }),
  bars_both: (g, q) => bars(g, q, [{ label: 'under 29', vals: [{ v: 3.1, color: T.c1, name: '3.1%', sub: '2017–19' }, { v: 3.7, color: T.c1, name: '3.7%', sub: '2022–25' }] }, { label: 'older graduates', vals: [{ v: 1.9, color: T.c2, name: '1.9%', sub: '2017–19' }, { v: 1.8, color: T.c2, name: '1.8%', sub: '2022–25' }] }], { title: 'Young graduates rose, older graduates edged down', src: S_NYF, max: 4.2 }),
  line_remote_young: (g, q) => lineChart(g, q, [{ name: 'young graduates', color: T.c1, pts: [[0, 0], [.5, .35], [1, .95]], fmt: v => '+' + v.toFixed(1) + ' pt' }], { title: 'From-home jobs: change in unemployment', ymin: -.4, ymax: 1.2, xlabels: [[0, '2017–19'], [1, '2022–24']], src: S_NYF, note: 'young graduates: up almost a full percentage point' }),
  line_remote_both: (g, q) => lineChart(g, Math.min(1, .6 + q / 2), [{ name: 'young graduates', color: T.c1, pts: [[0, 0], [.5, .35], [1, .95]], fmt: v => '+' + v.toFixed(1) + ' pt' }, { name: 'older workers', color: T.c2, pts: [[0, 0], [.5, -.05], [1, -.1]], fmt: v => v.toFixed(1) + ' pt' }], { title: 'From-home jobs: change in unemployment', ymin: -.4, ymax: 1.2, xlabels: [[0, '2017–19'], [1, '2022–24']], src: S_NYF }),
  line_showup: (g, q) => lineChart(g, q, [{ name: 'young − older gap', color: T.c1, pts: [[0, 0], [.3, .05], [.45, .6], [.6, .15], [1, .05]] }], { title: 'Show-up jobs: the gap bumped in 2020, then returned', ymin: -.4, ymax: 1.2, xlabels: [[0, '2017'], [.45, '2020'], [1, '2024']], src: S_NYF }),
  desks_close: (g, q) => desks(g, q, false), desks_apart: (g, q) => desks(g, q, true),
  mentoring_drop: (g, q) => bars(g, q, [{ label: 'co-located', vals: [{ v: 100, color: T.c1, name: 'more' }] }, { label: 'a short distance apart', vals: [{ v: 45, color: T.c2, name: 'less' }] }, { label: 'younger workers', vals: [{ v: 30, color: T.c3, name: 'least' }] }], { title: 'Feedback and mentoring (illustrative scale)', src: S_NYF + ' · one Fortune 500 firm', max: 110, bw: 200 }),
  donut_64: (g, q) => donut(g, q, .64, ['of the recent increase in', 'young graduate unemployment', 'can be explained by remote work'], S_NYF, true),
  donut_quarter: (g, q) => donut(g, q, .25, ['of the decline it measured', 'can be traced to rate shocks', 'through 2023 (up to)'], S_CEN, true),

// ——— build & render ———
const R = { PAGE, CARD, CUT, STOCK, TL, CHART, UI };
const plan = CUTS.map(c => { const draw = R[c.k](c); return { c, el: stage.lastElementChild, draw }; });
const XF = 0.12;  // 컷: 짧은 페이드만
window.render = t => {
  let active = -1;
  for (let i = 0; i < plan.length; i++) { const { c } = plan[i]; if (t >= c.t && t < c.t + c.d) active = i; }
  plan.forEach(b => { b.el.classList.remove('blurred'); b.el.style.opacity = 0; });
  if (active < 0) return;
  const { c, el: node, draw } = plan[active], lt = t - c.t;
  if (active > 0 && (c.k === 'CARD' || c.over)) { const prev = plan[active - 1]; if (c.k === 'CARD') prev.el.classList.add('blurred'); else prev.el.style.opacity = 1; prev.draw(1, prev.c.d + lt, 1); }  // 카드는 앞 컷을 흐려 깔고, over 컷은 앞 컷 위에 그대로 얹는다
  node.style.opacity = Math.min(eo(seg(lt, 0, XF)), 1 - seg(lt, c.d - XF, c.d));
  draw(clamp(lt / 1.2), lt, clamp(lt / c.d));
};
await document.fonts.ready;
await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
window.render(0);
window.READY = true;
